project_id = "tashan"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "letters_digits"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
enable_confirmations = true

# These local CLI settings do not configure an existing hosted Supabase project.
# Disable public signup and anonymous sign-in in hosted Auth settings before launch.
